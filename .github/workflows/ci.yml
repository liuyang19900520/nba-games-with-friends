name: CI (v2)
on:
  pull_request:
  push:
    branches: [v2]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build H5 (mock data)
        run: npx taro build --type h5
        env:
          TARO_APP_API_MODE: mock
      - name: Build WeChat mini program
        run: npx taro build --type weapp
      - name: Check weapp main package < 2MB
        run: |
          test -f dist/weapp/app.json
          bytes=$(find dist/weapp -type f ! -name '*.LICENSE.txt' -printf '%s\n' | awk '{s+=$1} END {print s}')
          echo "weapp main package: $bytes bytes"
          echo "### weapp main package: $((bytes/1024)) KB (limit 2048 KB)" >> "$GITHUB_STEP_SUMMARY"
          test "$bytes" -lt 2097152
      - uses: actions/upload-artifact@v4
        with:
          name: h5-dist
          path: app/dist/h5
          retention-days: 7
